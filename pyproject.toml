[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nebulabrot"
version = "0.1.0"
description = "Deterministic Nebulabrot renderer: plot Mandelbrot orbits instead of escaping them"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["numpy", "pillow"]

[project.scripts]
nebulabrot = "nebulabrot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "NPY", "RUF"]

[tool.pyrefly]
project-includes = ["src", "tests"]
